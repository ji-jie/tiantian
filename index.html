<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I miss you</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f6f6;
      font-family: -apple-system, BlinkMacSystemFont, Arial;
    }
    .box {
      background: white;
      padding: 30px 40px;
      border-radius: 16px;
      font-size: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <div class="box">
    I miss you.
  </div>
</body>
</html>
