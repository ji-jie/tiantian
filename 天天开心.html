<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>天天开心</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial;
    background: linear-gradient(135deg, #ffd6e8, #fff1f7);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 24px 20px;
    width: 85%;
    max-width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
    animation: pop 0.4s ease-out;
  }
  @keyframes pop {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  h1 {
    font-size: 20px;
    margin-bottom: 12px;
  }
  p {
    font-size: 16px;
    color: #444;
    line-height: 1.6;
  }
  button {
    margin-top: 18px;
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: #ff6fa1;
    color: #fff;
    font-size: 15px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>天天开心 😊</h1>
    <p>
      希望你每天醒来，<br/>
      心里都有一点甜。
    </p>
    <button onclick="changeText()">再看一句</button>
  </div>

<script>
  const texts = [
    "愿你今天比昨天轻松一点 🌷",
    "烦恼走开，好心情留下 ☁️",
    "你值得所有温柔的事 💗",
    "记得笑一笑，世界会更软 ✨"
    "有任何不开心都可以告诉我 🌷"
    "眉头舒展，万事称心 🌷"
    "每天要记得好好吃饭 💗 "
  ];
  function changeText(){
    const p = document.querySelector('p');
    p.innerHTML = texts[Math.floor(Math.random()*texts.length)];
  }
</script>
</body>
</html>
